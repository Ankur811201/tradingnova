<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>.</dir>
  <match target="pattern">
    <test name="family" qual="any"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign"><string>DejaVu Sans</string></edit>
  </match>
  <match target="pattern">
    <test name="family" qual="any"><string>DejaVu Sans Mono</string></test>
    <edit name="family" mode="assign"><string>DejaVu Sans Mono</string></edit>
  </match>
</fontconfig>
